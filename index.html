<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro Lele Kalkulator</title>
<style>
  body {
    font-family: "Poppins", sans-serif;
    background: linear-gradient(180deg, #2d2d2d, #444);
    color: #fff;
    padding: 20px;
  }
  h1 {
    font-family: "Playfair Display", serif;
    font-size: 28px;
    color: gold;
    margin-bottom: 10px;
    text-align: center;
  }
  .input-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.1);
    padding: 8px;
    border-radius: 10px;
    margin: 8px 0;
  }
  .input-row label {
    flex: 1;
    text-align: left;
  }
  .input-row input, .input-row select {
    flex: 1;
    max-width: 15ch;
    text-align: right;
    border: none;
    background: rgba(255,255,255,0.2);
    color: #fff;
    padding: 4px;
    border-radius: 5px;
  }
  .input-row .note {
    flex: 1;
    text-align: left;
    font-size: 10px;
    color: #bbb;
    padding-left: 10px;
  }
  button {
    background: gold;
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 15px;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
  }
  #result, #rincian {
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    padding: 6px;
    border: 1px solid #ddd;
  }
  th {
    background-color: #333;
    color: gold;
  }
  td {
    text-align: right;
  }
  td:first-child, th:first-child { text-align: left; }
  .highlight { background-color: gold; color: #000; font-weight: bold; }
  footer { margin-top: 30px; font-size: 12px; color: rgba(255,255,255,0.6); text-align: center; }
</style>
</head>
<body>

<h1>Metro Lele Kalkulator</h1>

<div class="input-row">
  <label>Jenis Lele:</label>
  <select id="jenis">
    <option value="sangkuriang">Sangkuriang</option>
    <option value="nila">Nila</option>
    <option value="biolele">Biolele</option>
    <option value="lelemas">Lele Mas</option>
    <option value="lelebl">Lele BL</option>
    <option value="lelecp">Lele CP</option>
  </select>
  <span class="note">Jenis lele memengaruhi jumlah telur rata-rata</span>
</div>

<div class="input-row">
  <label>Berat Induk Betina (kg):</label>
  <input type="number" id="beratInduk" value="0" min="0" max="999999999999999">
  <span class="note">Total berat induk untuk perhitungan</span>
</div>

<div class="input-row">
  <label>Ukuran Bibit Saat Panen:</label>
  <select id="ukuranBibit">
    <option value="2-3">2-3 cm</option>
    <option value="3-5">3-5 cm</option>
    <option value="5-7" selected>5-7 cm</option>
    <option value="7-10">7-10 cm</option>
  </select>
  <span class="note">Ukuran bibit memengaruhi konsumsi pakan</span>
</div>

<div class="input-row">
  <label>Harga Cacing (Rp/kg):</label>
  <input type="number" id="hargaCacing" value="65000">
  <span class="note">Harga rata-rata lokal</span>
</div>

<div class="input-row">
  <label>Harga Pelet (Rp/kg):</label>
  <input type="number" id="hargaPelet" value="14000">
  <span class="note">Harga rata-rata lokal</span>
</div>

<div class="input-row">
  <label>Listrik (Rp):</label>
  <input type="number" id="listrik" value="0">
  <span class="note">Biaya listrik</span>
</div>

<div class="input-row">
  <label>Gaji (Rp):</label>
  <input type="number" id="gaji" value="0">
  <span class="note">Biaya tenaga kerja</span>
</div>

<div class="input-row">
  <label>Bonus (Rp/gelas):</label>
  <input type="number" id="bonus" value="0">
  <span class="note">Bonus tenaga kerja</span>
</div>

<button onclick="hitungHPP()">Hitung HPP</button>
<button onclick="toggleRincian()">Klik Rincian</button>

<div id="result"></div>

<div id="rincian" style="display:none"></div>

<footer>© 2025 Metro Lele</footer>

<script>
const jenisTelur = {
  sangkuriang: 30000,
  nila: 28000,
  biolele: 32000,
  lelemas: 31000,
  lelebl: 29000,
  lelecp: 33000
};

const bibitPerGelas = { "2-3": 90, "3-5": 100, "5-7": 115, "7-10": 130 };
const faseCacing = 10; // hari
const fasePelet = 35; // hari

function hitungHPP(){
  const jenis = document.getElementById('jenis').value;
  const berat = +document.getElementById('beratInduk').value;
  const ukuran = document.getElementById('ukuranBibit').value;
  const hargaCacing = +document.getElementById('hargaCacing').value;
  const hargaPelet = +document.getElementById('hargaPelet').value;
  const listrik = +document.getElementById('listrik').value;
  const gaji = +document.getElementById('gaji').value;
  const bonus = +document.getElementById('bonus').value;

  // Perhitungan dasar
  const jmlTelur = jenisTelur[jenis] * berat;
  const larvaHidup = jmlTelur * 0.85;
  const bibitHidup = larvaHidup * 0.5; // asumsi survival 50%
  const totalBibit = bibitHidup;

  // Pakan
  const pakanCacing = totalBibit * 0.002 * faseCacing; // 2gr/ekor x 10 hari
  const pakanPelet = totalBibit * 0.005 * fasePelet;  // 5gr/ekor x 35 hari
  const biayaCacing = (pakanCacing * hargaCacing/1000);
  const biayaPelet = (pakanPelet * hargaPelet/1000);

  const totalBiaya = biayaCacing + biayaPelet + listrik + gaji + bonus;
  const jmlGelas = Math.ceil(totalBibit / bibitPerGelas[ukuran]);
  const hargaPerGelas = 10000; // default
  const totalPenjualan = jmlGelas * hargaPerGelas;
  const labaBersih = totalPenjualan - totalBiaya;
  const hpp = totalBiaya / jmlGelas;

  // Tampilkan HPP
  document.getElementById('result').innerHTML = `
    <h3>📊 Hasil Perhitungan</h3>
    <p style="text-align:left;">Total Bibit Hidup: <b>${Math.round(totalBibit).toLocaleString()}</b> ekor</p>
    <p style="text-align:left;">Total Biaya: <b>${Math.round(totalBiaya).toLocaleString()}</b> Rp</p>
    <p style="text-align:left;">HPP per Gelas: <b>${Math.round(hpp).toLocaleString()}</b> Rp</p>
    <p style="text-align:left;">Laba Bersih: <b>${Math.round(labaBersih).toLocaleString()}</b> Rp</p>
    <p style="text-align:left; font-size:12px; color:#bbb;">*Perhitungan hanya perkiraan, bisa berbeda di lapangan</p>
  `;

  // Simpan detail untuk tabel rincian
  window._detailHPP = { jmlTelur, larvaHidup, bibitHidup, pakanCacing, pakanPelet, biayaCacing, biayaPelet, listrik, gaji, bonus, totalBiaya, jmlGelas, hargaPerGelas, totalPenjualan, labaBersih, hpp, ukuran, faseCacing, fasePelet };
}

function toggleRincian(){
  const rincianDiv = document.getElementById('rincian');
  if(rincianDiv.style.display === 'none'){
    const d = window._detailHPP;
    if(!d){ alert("Klik Hitung HPP dulu"); return; }

    // buat tabel rincian
    let html = `<h3>📋 Rincian Perhitungan</h3>
    <table>
      <tr><th>Parameter</th><th>Nilai</th><th>Satuan</th><th>Keterangan</th></tr>
      <tr><td>Total Induk (kg)</td><td>${d.jmlTelur/d[jenisTelur[d.jenis]]}</td><td>kg</td><td>Berat total induk</td></tr>
      <tr><td>Rata-rata Jml Telur per kg</td><td>${d.jmlTelur/d.jmlTelur*d.jmlTelur}</td><td>butir</td><td>Jumlah telur per kg</td></tr>
      <tr><td>Tingkat Hidup Larva</td><td>${(d.larvaHidup/d.jmlTelur*100).toFixed(0)}</td><td>%</td><td>Persentase menetas</td></tr>
      <tr><td>Total Larva Hidup</td><td>${Math.round(d.larvaHidup).toLocaleString()}</td><td>ekor</td><td></td></tr>
      <tr><td>Total Bibit Hidup</td><td>${Math.round(d.bibitHidup).toLocaleString()}</td><td>ekor</td><td></td></tr>
      <tr><td>Pakan Cacing</td><td>${d.pakanCacing.toFixed(2)}</td><td>kg</td><td>Fase ${d.faseCacing} hari</td></tr>
      <tr><td>Pakan Pelet</td><td>${d.pakanPelet.toFixed(2)}</td><td>kg</td><td>Fase ${d.fasePelet} hari</td></tr>
      <tr><td>Biaya Cacing</td><td>${Math.round(d.biayaCacing).toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr><td>Biaya Pelet</td><td>${Math.round(d.biayaPelet).toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr><td>Listrik</td><td>${Math.round(d.listrik).toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr><td>Gaji</td><td>${Math.round(d.gaji).toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr><td>Bonus</td><td>${Math.round(d.bonus).toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr class="highlight"><td>Total Biaya</td><td>${Math.round(d.totalBiaya).toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr><td>Jumlah Gelas</td><td>${d.jmlGelas}</td><td>gelas</td><td>Bibit per gelas ${bibitPerGelas[d.ukuran]}</td></tr>
      <tr><td>Harga per Gelas</td><td>${d.hargaPerGelas.toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr><td>Total Penjualan</td><td>${Math.round(d.totalPenjualan).toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr class="highlight"><td>Laba Bersih</td><td>${Math.round(d.labaBersih).toLocaleString()}</td><td>Rp</td><td></td></tr>
      <tr class="highlight"><td>HPP per Gelas</td><td>${Math.round(d.hpp).toLocaleString()}</td><td>Rp</td><td></td></tr>
    </table>
    <button onclick="simpanPDF()">Simpan PDF</button>
    <p style="font-size:10px;color:#bbb;">Watermark © Metro Lele</p>
    `;
    rincianDiv.innerHTML = html;
    rincianDiv.style.display = 'block';
  } else {
    rincianDiv.style.display = 'none';
  }
}

function simpanPDF(){
  const element = document.getElementById('rincian');
  const opt = {
    filename: 'Rincian_HPP_MetroLele.pdf',
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
}

// Load html2pdf
var script = document.createElement('script');
script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js";
document.body.appendChild(script);

</script>

</body>
</html>
